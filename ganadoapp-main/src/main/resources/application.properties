spring.application.name=ganadoapp

# Puerto de la aplicación
server.port=8081
spring.config.import=optional:file:.env[.properties],optional:file:./ganadoapp-main/.env[.properties]
spring.sql.init.mode=always

spring.datasource.url=jdbc:mysql://localhost:3306/ganaderia_bd
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:12345}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MUY IMPORTANTE: no volver a usar update
spring.jpa.hibernate.ddl-auto=validate

# Mostrar SQL
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# Zona horaria y charset
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota
spring.datasource.hikari.connection-init-sql=SET NAMES utf8mb4

# Evita consultas durante el render de vistas
spring.jpa.open-in-view=false

# Sesión
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.timeout=30m

# Administrador inicial
app.bootstrap-admin.enabled=${APP_BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap-admin.name=${APP_BOOTSTRAP_ADMIN_NAME:}
app.bootstrap-admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}

# Invitaciones
app.invitation.base-url=${APP_BASE_URL:}
app.invitation.allow-local-url=${APP_ALLOW_LOCAL_URL:false}

# Correo
app.mail.from=${MAIL_FROM:}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Groq
groq.api-key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:qwen/qwen3.8-27b}
