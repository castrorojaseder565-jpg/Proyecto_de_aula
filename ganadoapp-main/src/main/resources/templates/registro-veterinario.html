<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registro veterinario | BoviControl</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon-ganado-grande.svg}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/ganado-ui.css}">
</head>
<body class="page-auth vet-register-page">
<main class="vet-register-shell">
    <section class="vet-register-card" data-reveal>
        <div class="vet-register-top">
            <a class="brand" th:href="@{/}">
                <span class="brand-badge"><i class="fas fa-shield-halved"></i></span>
                <span>BoviControl</span>
            </a>
            <a th:href="@{/login}" class="vet-register-back"><i class="fas fa-arrow-left"></i> Login</a>
        </div>

        <div class="vet-register-title">
            <span><i class="fas fa-user-doctor"></i> Acceso veterinario</span>
            <h1>Crear cuenta</h1>
        </div>

        <div th:if="${#fields.hasAnyErrors()}" class="notice notice-error">
            <span th:each="error : ${#fields.allErrors()}" th:text="${error}">Error al registrar.</span>
        </div>

        <form th:action="@{/registro}" th:object="${registro}" method="post" onsubmit="return validatePassword()" data-auth-form>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="vet-register-fields">
                <div class="field field-enhanced">
                    <label for="nombre">Nombre completo</label>
                    <input class="input" type="text" id="nombre" th:field="*{nombre}" placeholder="Nombre del profesional" autocomplete="name" required>
                </div>
                <div class="field field-enhanced">
                    <label for="correo">Correo electrónico</label>
                    <input class="input" type="email" id="correo" th:field="*{correo}" placeholder="veterinario@finca.com" autocomplete="email" required>
                </div>
                <div class="field field-enhanced">
                    <label for="password">Contraseña</label>
                    <div class="input-with-action">
                        <input class="input" type="password" id="password" th:field="*{password}" minlength="12" autocomplete="new-password" required>
                        <button class="input-action-btn" type="button" data-toggle-password="password" aria-label="Mostrar u ocultar contraseña">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div class="password-strength">
                        <div id="password-strength-fill" class="password-strength-fill"></div>
                    </div>
                </div>
                <div class="field field-enhanced">
                    <label for="confirmPassword">Confirmar contraseña</label>
                    <div class="input-with-action">
                        <input class="input" type="password" id="confirmPassword" th:field="*{confirmPassword}" minlength="12" autocomplete="new-password" required>
                        <button class="input-action-btn" type="button" data-toggle-password="confirmPassword" aria-label="Mostrar u ocultar confirmación de contraseña">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
            </div>

            <div id="password-match-error" class="notice notice-error" style="display:none; margin-top:16px;">Las contraseñas no coinciden.</div>

            <button type="submit" class="vet-register-submit">
                Crear cuenta veterinaria
                <i class="fas fa-arrow-right"></i>
            </button>
        </form>
    </section>
</main>

<script>
    function validatePassword() {
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const errorDiv = document.getElementById('password-match-error');

        if (password.length < 12) {
            errorDiv.textContent = 'La contraseña debe tener al menos 12 caracteres.';
            errorDiv.style.display = 'block';
            return false;
        }

        if (password !== confirmPassword) {
            errorDiv.textContent = 'Las contraseñas no coinciden.';
            errorDiv.style.display = 'block';
            return false;
        }

        errorDiv.style.display = 'none';
        return true;
    }
</script>
<script th:src="@{/js/ganado-ui.js}"></script>
    <div th:replace="~{fragments/bovibot :: widget}"></div>
</body>
</html>
