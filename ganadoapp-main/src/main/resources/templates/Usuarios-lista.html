<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Usuarios registrados | BoviControl</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon-ganado-grande.svg}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/ganado-ui.css}">
</head>
<body class="app-body">
<div th:replace="~{fragments/layout :: sidebar('usuarios')}"></div>
<div class="app-frame">
    <header th:replace="~{fragments/layout :: app-header(title='Usuarios', subtitle='Equipo con acceso a la plataforma')}"></header>
    <main class="app-content">
    <section class="section">
        <div class="table-card" data-reveal>
            <div class="page-head">
                <div>
                    <h1 class="page-title">Usuarios registrados</h1>
                    <p class="page-subtitle">Administración del equipo que opera la plataforma ganadera.</p>
                </div>
                <div class="actions-inline">
                    <a th:href="@{/usuarios/invitaciones}" class="btn btn-primary"><i class="fas fa-envelope"></i> Invitar veterinario por correo</a>
                    <a th:href="@{/ganado/lista}" class="btn btn-outline"><i class="fas fa-arrow-left"></i> Volver</a>
                </div>
            </div>
            <div th:if="${exito}" class="notice notice-success" style="margin-bottom:18px;"><span th:text="${exito}"></span></div>
            <div th:if="${error}" class="notice notice-error" style="margin-bottom:18px;"><span th:text="${error}"></span></div>
            <div th:if="${not #lists.isEmpty(solicitudesPendientes)}" class="notice notice-info" style="margin-bottom:18px;">
                <strong th:text="|${#lists.size(solicitudesPendientes)} solicitud(es) pendiente(s) de aprobación|">Solicitud pendiente</strong>
                <div th:each="solicitud : ${solicitudesPendientes}" class="actions-inline" style="margin-top:10px;">
                    <span th:text="|${solicitud.nombre} · ${solicitud.correo}|">Veterinario</span>
                    <form th:action="@{/usuarios/{id}/aprobar(id=${solicitud.usuarioId})}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button type="submit" class="btn btn-primary btn-mini" data-confirm="¿Aprobar este acceso exclusivamente como veterinario?">Aprobar acceso (solo veterinario)</button>
                    </form>
                </div>
            </div>
            <div class="table-scroll">
                <table>
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre completo</th>
                        <th>Correo</th>
                        <th>Rol</th>
                        <th>Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="u : ${usuarios}">
                        <td th:text="${u.id}">1</td>
                        <td th:text="${u.nombre}">Juan Pérez</td>
                        <td th:text="${u.correo}">correo</td>
                        <td>
                            <span class="rol-badge"
                                  th:classappend="${u.rol == 'ADMIN' or u.rol == 'ADMINISTRADOR' ? ' rol-admin' : ' rol-veterinario'}"
                                  th:text="${u.rol == 'ADMINISTRADOR' ? 'ADMIN' : u.rol}">ROL</span>
                        </td>
                        <td>
                            <div class="actions-inline">
                                <a th:href="@{/usuarios/editar/{id}(id=${u.id})}" class="btn btn-warning btn-mini">Editar</a>
                                <form th:action="@{/usuarios/eliminar/{id}(id=${u.id})}" method="post">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                    <button type="submit" class="btn btn-danger btn-mini" data-confirm="¿Estás seguro de eliminar este usuario?">Eliminar</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(usuarios)}">
                        <td colspan="5"><div class="empty-card">No se encontraron usuarios registrados en el sistema.</div></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>
    </main>
</div>
<script th:src="@{/js/ganado-ui.js}"></script>
    <div th:replace="~{fragments/bovibot :: widget}"></div>
</body>
</html>
