<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registrar ganado | BoviControl</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon-ganado-grande.svg}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/ganado-ui.css}">
</head>
<body class="app-body">
<div th:replace="~{fragments/layout :: sidebar('nuevo')}"></div>
<div class="app-frame">
    <header th:replace="~{fragments/layout :: app-header(title='Registrar ganado', subtitle='Nueva ficha del inventario bovino')}"></header>
    <main class="app-content">
    <section class="section">
        <div class="form-card" data-reveal style="max-width: 860px; margin: 0 auto;">
            <span class="eyebrow" style="background:rgba(47,107,61,0.08); color:var(--primary);"><i class="fas fa-id-card"></i> Registro de bovino</span>
            <h2 class="page-title">Registrar ganado</h2>
            <p class="page-subtitle">Formulario de registro de bovinos.</p>

            <div th:if="${error}" class="notice notice-error"><span th:text="${error}"></span></div>
            <div th:if="${mensaje}" class="notice notice-success"><span th:text="${mensaje}"></span></div>

            <form th:action="@{/ganado/guardar}" th:object="${ganado}" method="post" id="registroGanadoForm">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="form-grid" style="row-gap:10px;">
                    <div class="field span-6">
                        <label for="numeroArete">número de arete</label>
                        <input class="input" type="text" id="numeroArete" th:field="*{numeroArete}" placeholder="Ej: 001" minlength="1" maxlength="20" pattern="[0-9]+" inputmode="numeric" required>
                        <small id="areteError" class="notice notice-error" style="display:none; margin:8px 0 0; padding:10px 12px;">Ya existe un ganado con este número de arete.</small>
                    </div>

                    <div class="field span-6">
                        <label for="marcaHierro">Marca de hierro</label>
                        <input class="input readonly" type="text" id="marcaHierro" th:field="*{marcaHierro}" readonly>
                    </div>

                    <div class="field span-12">
                        <label for="propietario">Propietario</label>
                        <input class="input readonly" type="text" id="propietario" th:field="*{propietario}" readonly>
                    </div>

                    <div class="field span-6">
                        <label for="nombre">Nombre del bovino</label>
                        <input class="input" type="text" id="nombre" th:field="*{nombre}" placeholder="Ej: Lucera 15" minlength="2" maxlength="80" required>
                    </div>

                    <div class="field span-6">
                        <label for="raza">Raza</label>
                        <select class="select" id="raza" th:field="*{raza}" onchange="toggleOtraRaza()" required>
                            <option value="">Seleccionar raza</option>
                            <option value="Holstein">Holstein</option>
                            <option value="Brahman">Brahman</option>
                            <option value="Angus">Angus</option>
                            <option value="Jersey">Jersey</option>
                            <option value="Hereford">Hereford</option>
                            <option value="Charolais">Charolais</option>
                            <option value="Otros">Otro o mestizo</option>
                        </select>
                    </div>

                    <div class="field span-12" id="otraRazaContainer"
                         th:style="${ganado != null and ganado.raza != null and #strings.equalsIgnoreCase(ganado.raza, 'Otros') ? 'display:block;' : 'display:none;'}">
                        <label for="otraRaza">Especificar raza o mestizaje</label>
                        <input class="input" type="text" id="otraRaza" name="otraRaza" th:value="${otraRaza}" placeholder="Ej: Criolla x Holstein">
                    </div>

                    <div class="field span-4">
                        <label for="edad">Edad (años)</label>
                        <input class="input" type="number" min="0" max="40" step="0.1" id="edad" th:field="*{edad}" placeholder="Ej: 2.5" required>
                    </div>

                    <div class="field span-4">
                        <label for="peso">Peso (kg)</label>
                        <input class="input" type="number" min="1" max="2000" step="0.5" id="peso" th:field="*{peso}" placeholder="Ej: 430" required>
                    </div>

                    <div class="field span-4">
                        <label for="sexo">Sexo</label>
                        <select class="select" id="sexo" th:field="*{sexo}" required>
                            <option value="">Seleccionar</option>
                            <option value="Macho">Macho</option>
                            <option value="Hembra">Hembra</option>
                        </select>
                    </div>

                    <div class="field span-12">
                        <label for="estadoSalud">Estado de salud</label>
                        <select class="select" id="estadoSalud" th:field="*{estadoSalud}" required>
                            <option value="">Seleccionar</option>
                            <option value="Saludable">Saludable</option>
                            <option value="Enfermo">Enfermo</option>
                        </select>
                    </div>
                </div>

                <div class="action-row" style="margin-top:24px;">
                    <button id="btnGuardar" type="submit" class="btn btn-primary"><i class="fas fa-floppy-disk"></i> Guardar bovino</button>
                    <a th:href="@{/ganado/lista}" class="btn btn-outline"><i class="fas fa-xmark"></i> Cancelar</a>
                </div>
            </form>
        </div>
    </section>
    </main>
</div>

<script>
    const areteInput = document.getElementById("numeroArete");
    const areteError = document.getElementById("areteError");
    const btnGuardar = document.getElementById("btnGuardar");
    const razaSelect = document.getElementById("raza");
    const otraRazaContainer = document.getElementById("otraRazaContainer");
    const otraRazaInput = document.getElementById("otraRaza");

    async function validarArete() {
        const valor = areteInput.value.trim();
        if (!valor) {
            areteError.style.display = "none";
            areteInput.setCustomValidity("");
            btnGuardar.disabled = false;
            return;
        }

        try {
            const res = await fetch(`/ganado/existe-arete?numeroArete=${encodeURIComponent(valor)}`);
            const existe = await res.json();
            areteError.style.display = existe ? "block" : "none";
            areteInput.setCustomValidity(existe ? "Ya existe un ganado con este número de arete." : "");
            btnGuardar.disabled = existe;
        } catch (e) {
            areteError.style.display = "none";
            areteInput.setCustomValidity("");
            btnGuardar.disabled = false;
        }
    }

    function toggleOtraRaza() {
        const mostrar = razaSelect.value === "Otros";
        otraRazaContainer.style.display = mostrar ? "block" : "none";
        otraRazaInput.required = mostrar;
        if (!mostrar) {
            otraRazaInput.value = "";
        }
    }

    function normalizarAreteInput() {
        const limpio = areteInput.value.replace(/[^0-9]/g, "");
        if (areteInput.value !== limpio) {
            areteInput.value = limpio;
        }
    }

    areteInput.addEventListener("blur", validarArete);
    areteInput.addEventListener("input", () => {
        normalizarAreteInput();
        areteError.style.display = "none";
        areteInput.setCustomValidity("");
        btnGuardar.disabled = false;
    });

    window.addEventListener("DOMContentLoaded", () => {
        toggleOtraRaza();
    });
</script>
<script th:src="@{/js/ganado-ui.js}"></script>
    <div th:replace="~{fragments/bovibot :: widget}"></div>
</body>
</html>
