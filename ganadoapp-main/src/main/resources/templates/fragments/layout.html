<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<aside th:fragment="sidebar(active)" class="app-sidebar" id="app-sidebar">
    <a class="app-brand" th:href="@{/ganado/lista}">
        <span class="brand-badge"><img th:src="@{/images/ganado-mark.svg}" alt="Silueta de ganado"></span>
        <span>
            <strong>BoviControl</strong>
        </span>
    </a>

    <nav class="app-nav" aria-label="Menú principal">
        <p class="app-nav-label">Operación</p>
        <a th:href="@{/ganado/lista}" th:classappend="${active == 'lista'} ? ' is-active'">
            <i class="fas fa-border-all"></i> Panel del hato
        </a>
        <a th:href="@{/ganado/nuevo}" sec:authorize="hasRole('ADMIN')" th:classappend="${active == 'nuevo'} ? ' is-active'">
            <i class="fas fa-plus"></i> Registrar bovino
        </a>
        <a th:href="@{/ganado/estadisticas}" sec:authorize="hasRole('ADMIN')" th:classappend="${active == 'stats'} ? ' is-active'">
            <i class="fas fa-chart-column"></i> Estadísticas
        </a>
        <a href="https://app.powerbi.com/groups/me/reports/af0d9c68-5003-45d8-be7d-2775bd3e9a0c/b457f95b4fca93a34527?experience=power-bi"
           sec:authorize="hasRole('ADMIN')" target="_blank" rel="noopener noreferrer">
            <i class="fas fa-chart-line"></i> Dashboard Power BI
        </a>

        <p class="app-nav-label">Salud animal</p>
        <a th:href="@{/ganado/gestion-sanitaria}" th:classappend="${active == 'sanitaria'} ? ' is-active'">
            <i class="fas fa-heart-pulse"></i> Gestión sanitaria
        </a>
        <a th:href="@{/vacuna/todas}" th:classappend="${active == 'vacunas'} ? ' is-active'">
            <i class="fas fa-syringe"></i> Vacunas
        </a>
        <a th:href="@{/vacuna/registrar}" sec:authorize="hasRole('VETERINARIO')" th:classappend="${active == 'vacuna-nueva'} ? ' is-active'">
            <i class="fas fa-notes-medical"></i> Registrar vacuna
        </a>

        <p class="app-nav-label" sec:authorize="hasRole('ADMIN')">Administración</p>
        <a th:href="@{/usuarios}" sec:authorize="hasRole('ADMIN')" th:classappend="${active == 'usuarios'} ? ' is-active'">
            <i class="fas fa-users"></i> Usuarios
        </a>
        <a th:href="@{/usuarios/invitaciones}" sec:authorize="hasRole('ADMIN')" th:classappend="${active == 'invitaciones'} ? ' is-active'">
            <i class="fas fa-envelope"></i> Invitaciones
        </a>
    </nav>

    <div class="app-sidebar-foot">
        <div class="app-user-card">
            <span class="app-user-avatar"><i class="fas fa-user"></i></span>
            <div>
                <strong th:text="${#authentication.name}">Usuario</strong>
                <small sec:authorize="hasRole('ADMIN')">Administrador</small>
                <small sec:authorize="hasRole('VETERINARIO')">Veterinario</small>
            </div>
        </div>
        <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button class="btn btn-outline btn-mini app-logout" type="submit">
                <i class="fas fa-right-from-bracket"></i> Cerrar sesión
            </button>
        </form>
    </div>
</aside>

<header th:fragment="app-header(title, subtitle)" class="app-topbar">
    <button class="app-menu-btn" type="button" id="sidebar-toggle" aria-label="Abrir o cerrar menú">
        <i class="fas fa-bars"></i>
    </button>
    <div class="app-topbar-copy">
        <p class="app-greeting"><span data-greeting>Hola</span></p>
        <h1 th:text="${title}">Panel</h1>
        <p class="muted" th:if="${subtitle}" th:text="${subtitle}"></p>
    </div>
    <div class="app-topbar-meta">
        <span class="sync-pill"><i class="fas fa-circle"></i> En línea</span>
        <span class="chip" sec:authorize="hasRole('ADMIN')"><i class="fas fa-shield-halved"></i> Admin</span>
        <span class="chip" sec:authorize="hasRole('VETERINARIO')"><i class="fas fa-user-doctor"></i> Veterinario</span>
    </div>
</header>
</body>
</html>
